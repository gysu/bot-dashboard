<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bot 指揮台</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--ok:#10b981;--idle:#f59e0b;--bad:#ef4444;--blue:#3b82f6;--pur:#8b5cf6}
.dark{--bg:#0f172a;--card:#1e293b;--tx:#e5e7eb;--mu:#94a3b8;--bd:#334155}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:26px;background:linear-gradient(90deg,#6366f1,#ec4899,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.upd{color:var(--mu);font-size:13px}button{font:inherit;cursor:pointer}
.tog{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px}
nav{display:flex;gap:6px;padding:0 20px;overflow-x:auto;border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;color:var(--mu);padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--tx);border-color:#6366f1;font-weight:600}
main{padding:20px;max-width:1200px;margin:auto}section{display:none}section.on{display:block}
h2{font-size:17px;margin:22px 0 10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}.stat b{font-size:28px;display:block}.stat span{color:var(--mu);font-size:13px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.need li{margin:6px 0}.badge{display:inline-block;background:#6366f1;color:#fff;border-radius:10px;padding:0 8px;font-size:13px;margin-left:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bot .top{display:flex;align-items:center;gap:10px}.bot .ic{font-size:28px}.bot .nm{font-weight:600}.mu{color:var(--mu);font-size:13px}
.bot dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:10px 0}.bot dt{color:var(--mu)}.bot dd{margin:0}
a.lk{color:#6366f1;cursor:pointer;text-decoration:none;font-size:14px}
.rp{display:grid;grid-template-columns:340px 1fr;gap:12px}@media(max-width:800px){.rp{grid-template-columns:1fr}}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools input,.tools select{flex:1;min-width:140px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.list h3{font-size:13px;color:var(--mu);margin:12px 0 6px}.item{padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}.item:hover,.item.on{background:var(--bg);border-color:var(--bd)}
.pane{white-space:pre-wrap;line-height:1.7;min-height:200px}
.tl .row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.tl .t{width:52px;color:var(--mu);font-variant-numeric:tabular-nums}
.now{border-top:2px dashed var(--bad);margin:6px 0;position:relative;height:0}.now span{position:absolute;right:0;top:-11px;background:var(--bg);color:var(--bad);font-size:12px;padding:0 6px}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:8px;padding:1px 6px;color:var(--mu);margin-left:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 12px}.chip.on{background:#6366f1;color:#fff;border-color:#6366f1}
.todo{border-left:6px solid;padding-left:14px}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9}
#lock form{width:min(340px,90vw)}#lock input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);margin:12px 0;font:inherit;background:var(--card);color:var(--tx)}
#lock button{width:100%;padding:10px;border:0;border-radius:10px;background:linear-gradient(90deg,#6366f1,#ec4899);color:#fff}

.office{border:4px solid #5b4636;border-radius:4px;overflow:hidden;image-rendering:pixelated;font-family:"Courier New",monospace,system-ui}
.wall{background:repeating-linear-gradient(90deg,#f3e3c3 0 16px,#ecd9b4 16px 32px);border-bottom:8px solid #b98b5e;padding:14px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.dark .wall{background:repeating-linear-gradient(90deg,#3b3350 0 16px,#352d48 16px 32px);border-bottom-color:#5b4636}
.board{background:#8fbc6a;border:6px solid #8b5a2b;box-shadow:4px 4px 0 #0003;padding:8px 12px;cursor:pointer;color:#1b3a12;min-width:150px}
.board b{font-size:26px;display:block}.board.alert{background:#f8b4b4;color:#7f1d1d}
.win{width:90px;height:56px;background:linear-gradient(#9ad7ff,#d6f0ff);border:6px solid #fff;outline:3px solid #8b5a2b;position:relative}
.dark .win{background:linear-gradient(#1e1b4b,#312e81)}.win:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:4px solid #fff}
.wclock{width:44px;height:44px;border-radius:50%;background:#fff;border:5px solid #8b5a2b;display:flex;align-items:center;justify-content:center;font-size:11px;color:#333;font-weight:bold}
.plant{font-size:34px;margin-left:auto}
.floor{background-color:#e8d5a9;background-image:linear-gradient(45deg,#dcc493 25%,transparent 25%,transparent 75%,#dcc493 75%),linear-gradient(45deg,#dcc493 25%,transparent 25%,transparent 75%,#dcc493 75%);background-size:32px 32px;background-position:0 0,16px 16px;padding:18px;display:grid;gap:18px 10px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.dark .floor{background-color:#2a2438;background-image:linear-gradient(45deg,#231e30 25%,transparent 25%,transparent 75%,#231e30 75%),linear-gradient(45deg,#231e30 25%,transparent 25%,transparent 75%,#231e30 75%)}
.desk{position:relative;height:150px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.desk:hover .lbl,.desk:focus .lbl{background:#6366f1;color:#fff}
.desk svg{shape-rendering:crispEdges;image-rendering:pixelated}
.lbl{margin-top:4px;background:#fffbe9;border:2px solid #5b4636;color:#3b2a1e;font-size:12px;padding:1px 6px;max-width:128px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold}
.dark .lbl{background:#1e293b;color:#e5e7eb}
.ch{position:absolute;bottom:70px;left:50%;margin-left:-66px;width:48px;height:64px}
.working .ch{animation:type .35s steps(2) infinite}@keyframes type{50%{transform:translateY(-2px)}}
.working .scr{animation:glow 1s steps(2) infinite}@keyframes glow{50%{fill:#a7f3d0}}
.idle .ch{animation:wander 6s steps(12) infinite;bottom:24px;margin-left:-24px}@keyframes wander{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px) scaleX(-1)}}
.steam{animation:steam 1.2s steps(3) infinite}@keyframes steam{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-6px)}}
.bub{position:absolute;top:0;left:50%;margin-left:6px;background:#fff;border:3px solid #111;padding:0 7px;font:bold 18px monospace;z-index:2}
.bub.r{color:#ef4444;animation:bob .6s steps(2) infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.bub.c{font-size:15px}
.sheet{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:8}
.sheet .card{width:min(560px,100%);max-height:80vh;overflow:auto;border-radius:14px 14px 0 0;border:4px solid #5b4636}
@media(min-width:700px){.sheet{align-items:center}.sheet .card{border-radius:8px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin-top:10px}
</style></head><body>

<header><div><h1>Bot 指揮台</h1><div class="upd" id="upd"></div></div><button class="tog" id="tog">🌙 深色</button></header>

async function dec(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},k,b64(ENC.ct))));}
const TZ='Asia/Taipei',fmt=(iso,o)=>iso?new Intl.DateTimeFormat('zh-TW',Object.assign({timeZone:TZ,hour12:false},o)).format(new Date(iso)):'—';

<h2>今天概況</h2><div class="stats"><div class="card stat"><b>${newr}</b><span>今天新報告</span></div><div class="card stat"><b>${ok}</b><span>Bot 正常／待命</span></div><div class="card stat"><b style="color:${bad?'var(--bad)':''}">${bad}</b><span>異常</span></div><div class="card stat"><b>${runs}</b><span>今天執行次數</span></div></div>

function deskSvg(m){const r=(x,y,w,h,c,k='')=>`<rect ${k} x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`,on=m==='working'||m==='blocked';
return `<svg viewBox="0 0 32 22" width="128" height="88">${r(10,0,12,9,'#374151')+r(11,1,10,7,on?'#34d399':'#1f2937','class="scr"')+(on?r(12,2,6,1,'#065f46')+r(12,4,8,1,'#065f46')+r(12,6,4,1,'#065f46'):'')+r(15,9,2,2,'#4b5563')+r(0,11,32,3,'#a0522d')+r(0,14,32,1,'#7a3e1d')+r(2,15,2,7,'#7a3e1d')+r(28,15,2,7,'#7a3e1d')+r(11,11,8,1,'#d1d5db')+r(24,9,3,2,'#fff')}</svg>`}
function office(){const need=D.todos.filter(t=>t.status==='等你決定').length,ML={working:'工作中',idle:'待命',blocked:'等你處理',scheduled:'已排程'};
$('#of').innerHTML=`<div class="office"><div class="wall"><div class="board ${need?'alert':''}" id="nb">📌 公告欄<b>${need}</b>${need?'件事需要你決定 →':'沒有待辦，一切順利 ✓'}</div><div class="win"></div><div class="wclock">${hm(new Date())}</div><div class="plant">🪴</div></div>
<div class="floor">${D.bots.map(b=>{const m=mood(b);return `<div class="desk ${m}" tabindex="0" data-o="${esc(b.id)}" title="${esc(b.name)}：${ML[m]}">${m==='blocked'?'<span class="bub r">!</span>':m==='scheduled'?'<span class="bub c">⏰</span>':''}${m==='idle'?'':person(b,m)}${deskSvg(m)}${m==='idle'?person(b,m):''}<div class="lbl">${esc(b.icon)} ${esc(b.name)}</div></div>`}).join('')}</div></div>
<div class="legend"><span>💻 工作中</span><span>☕ 待命走動</span><span style="color:var(--bad)">❗ 等你處理</span><span>⏰ 已排程</span><span>點 Bot 看詳情</span></div>`;
$('#nb').onclick=()=>{tf='等你決定';tab('td')};
document.querySelectorAll('[data-o]').forEach(x=>{const f=()=>openBot(x.dataset.o);x.onclick=f;x.onkeydown=e=>{if(e.key==='Enter')f()}})}
function openBot(id){const b=B[id];if(!b)return;const ts=D.todos.filter(t=>t.bot===id&&t.status==='等你決定'),rc=D.reports.filter(r=>r.bot===id).length;
const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div class="card bot"><div class="top"><span class="ic">${esc(b.icon)}</span><div><div class="nm">${esc(b.name)}</div><div class="mu">${esc(b.desc)}</div></div><button class="tog" style="margin-left:auto" id="xc">✕</button></div>
<dl><dt>狀態</dt><dd>${esc(b.status)}</dd><dt>最近工作</dt><dd>${esc(b.latest_work)}</dd><dt>上次執行</dt><dd>${dt(b.last_run)}</dd><dt>下次執行</dt><dd>${dt(b.next_run)}</dd><dt>排程</dt><dd>${esc(b.schedule)}</dd></dl>
<h2>等你決定 <span class="badge">${ts.length}</span></h2>${ts.length?ts.map(t=>`<div class="card todo" style="border-left-color:#ef4444;margin-bottom:8px"><b>${esc(t.title)}</b><div class="mu">${esc(t.detail)}</div></div>`).join(''):'<p class="mu">沒有需要你決定的事 ✓</p>'}
<p><a class="lk" id="xr">${rc} 則報告 →</a></p></div>`;document.body.appendChild(s);
s.onclick=e=>{if(e.target===s||e.target.id==='xc')s.remove();if(e.target.id==='xr'){s.remove();rf=id;sel=null;tab('rp')}}}
function tab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));if(D)render()}
$('#nav').onclick=e=>{if(e.target.dataset.t){if(e.target.dataset.t==='rp'&&e.isTrusted)rf='';tab(e.target.dataset.t)}};
const setDark=d=>{document.documentElement.classList.toggle('dark',d);$('#tog').textContent=d?'☀️ 淺色':'🌙 深色';localStorage.setItem('dash-dark',d?'1':'0')};
setDark(localStorage.getItem('dash-dark')==='1');$('#tog').onclick=()=>setDark(!document.documentElement.classList.contains('dark'));
async function unlock(pw){try{D=await dec(pw);sessionStorage.setItem('dash-pw',pw);$('#lock').remove();render();setInterval(()=>location.reload(),5*60*1000)}catch(e){$('#err').textContent='密碼錯誤';sessionStorage.removeItem('dash-pw')}}
$('#lf').onsubmit=e=>{e.preventDefault();unlock($('#pw').value)};const sp=sessionStorage.getItem('dash-pw');if(sp)unlock(sp);
</script></body></html>
